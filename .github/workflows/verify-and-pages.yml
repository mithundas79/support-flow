name: Verify and publish sample demo

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: support-flow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, unit tests and browser review
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check production dependency advisories
        run: npm audit --omit=dev --audit-level=high
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:automation
      - run: node --test scripts/verify-published-demo.test.mjs
      - run: npm run check:public
      - run: npx playwright install --with-deps chromium
      - run: npm run test:web:e2e
      - run: npm run test:e2e
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-evidence-${{ github.sha }}
          path: |
            playwright-report
            test-results
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
      - name: Preserve the exact browser-tested sample build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: built-sample-demo-${{ github.sha }}
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  integration:
    name: PostgreSQL, n8n, API and Mailpit integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Execute actual services with controlled provider fixtures
        shell: bash
        run: |
          mkdir -p .runtime/evidence
          node automation/scripts/run-integration.mjs 2>&1 | tee .runtime/evidence/stack.log
      - name: Preserve integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-evidence-${{ github.sha }}
          path: |
            .runtime/evidence
            test-results
            playwright-report
          if-no-files-found: ignore
          retention-days: 7

  verified-artifact:
    name: Preserve sample after every verification gate
    needs: [quality, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: built-sample-demo-${{ github.sha }}
          path: verified-demo
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-sample-demo-${{ github.sha }}
          path: verified-demo
          if-no-files-found: error
          retention-days: 7

  pages:
    name: Deploy verified sample artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.ENABLE_PAGES_DEPLOY == 'true'
    needs: [verified-artifact]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: verified-sample-demo-${{ github.sha }}
          path: verified-demo
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: verified-demo
      - name: Deploy the artifact built and tested in this run
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
