name: Bootstrap exact dependency lock

# Temporary branch-only workflow. Removed after its actual generated lock is committed.
on:
  push:
    branches: [feature/support-automation-release]

permissions:
  contents: read

jobs:
  lock:
    if: github.ref == 'refs/heads/feature/support-automation-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Generate real npm metadata and integrity lock
        run: npm install --package-lock-only --ignore-scripts --audit=false --fund=false
      - name: Preserve generated lock for an explicit reviewed commit
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: generated-package-lock-${{ github.sha }}
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
      - name: Commit only the generated lock on this exact review branch
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('node:fs');
            const branch = 'feature/support-automation-release';
            if (context.repo.owner !== 'mithundas79' || context.repo.repo !== 'support-flow' || context.ref !== 'refs/heads/' + branch) {
              throw new Error('Lock bootstrap is restricted to this repository and review branch.');
            }
            const ref = await github.rest.git.getRef({ ...context.repo, ref: 'heads/' + branch });
            if (ref.data.object.sha !== context.sha) throw new Error('Branch changed; refusing a stale lock commit.');
            const bytes = fs.readFileSync('package-lock.json');
            const lock = JSON.parse(bytes.toString('utf8'));
            if (lock.name !== 'support-flow' || lock.lockfileVersion !== 3) throw new Error('Unexpected generated lock.');
            let sha;
            try {
              const existing = await github.rest.repos.getContent({ ...context.repo, path: 'package-lock.json', ref: branch });
              sha = existing.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const result = await github.rest.repos.createOrUpdateFileContents({ ...context.repo, path: 'package-lock.json', branch,
              message: 'build: commit generated npm dependency integrity lock', content: bytes.toString('base64'), ...(sha ? { sha } : {}) });
            core.info('Generated lock commit: ' + result.data.commit.sha);
