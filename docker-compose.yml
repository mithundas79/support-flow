name: support-flow
services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    environment:
      POSTGRES_DB: support_flow
      POSTGRES_USER: support_flow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a local POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U support_flow -d support_flow"]
      interval: 3s
      timeout: 3s
      retries: 30
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://support_flow:${POSTGRES_PASSWORD}@postgres:5432/support_flow
      REVIEWER_TOKEN: ${REVIEWER_TOKEN:?Set a distinct reviewer token of 24+ characters}
      WORKFLOW_TOKEN: ${WORKFLOW_TOKEN:?Set a distinct workflow token of 24+ characters}
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:5173}
      DELIVERY_ALLOWED_DOMAINS: ${DELIVERY_ALLOWED_DOMAINS:-example.com,example.test,northstar.example}
      AI_PROVIDER_MODE: ${AI_PROVIDER_MODE:-fixture}
      DELIVERY_MODE: ${DELIVERY_MODE:-mailpit}
      PORT: 3000
      HOST: 0.0.0.0
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      timeout: 3s
      retries: 30
  provider-fixture:
    build:
      context: .
      dockerfile: automation/fixture-provider/Dockerfile
    environment:
      MAILPIT_HOST: mailpit
    ports:
      - "127.0.0.1:4010:4010"
    depends_on:
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
  n8n:
    image: n8nio/n8n:2.44.6
    environment:
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Set a local encryption key}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      API_INTERNAL_URL: http://api:3000/internal/v1
      WORKFLOW_TOKEN: ${WORKFLOW_TOKEN}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://provider-fixture:4010/v1}
      AI_PROVIDER_MODE: ${AI_PROVIDER_MODE:-fixture}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-controlled-fixture-no-real-key}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      PROVIDER_TIMEOUT_MS: ${PROVIDER_TIMEOUT_MS:-20000}
      AUTO_POLL_ENABLED: ${AUTO_POLL_ENABLED:-true}
      SLACK_ENABLED: ${SLACK_ENABLED:-false}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      REVIEW_UI_URL: ${REVIEW_UI_URL:-http://localhost:5173/support-flow/}
      GMAIL_MAILBOX_KEY: ${GMAIL_MAILBOX_KEY:-northstar-support}
      NORTHSTAR_SMTP_HOST: ${NORTHSTAR_SMTP_HOST:-mailpit}
      NORTHSTAR_SMTP_PORT: "1025"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./automation:/opt/automation:ro
    depends_on:
      api:
        condition: service_healthy
      provider-fixture:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 60
volumes:
  postgres_data:
  n8n_data:
